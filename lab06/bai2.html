<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Tính tuổi</title>
</head>

<body>

    <input type="number" id="namSinh" placeholder="Nhập năm sinh">
    <button onclick="tinhTuoi()">Tính tuổi</button>
    <p id="ketQua"></p>

    <script>
        function tinhTuoi() {
            let ns = parseInt(document.getElementById("namSinh").value);
            let namHienTai = new Date().getFullYear(); // Lấy năm hiện tại của hệ thống[cite: 1]
            let tuoi = namHienTai - ns;

            let kq = document.getElementById("ketQua");
            kq.innerText = "Tuổi: " + tuoi;
        }
    </script>

</body>

</html>
