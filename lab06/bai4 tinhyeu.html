<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>XEM BOI TINH YEU</h2>
    <label for="">Nhap ten ban</label>
    <input type="text" id="tenban">
    <br>
    <label for="">Nhap ten nguoi yeu</label>
    <input type="text" id="tennguoiyeu">
    <br> <br>
    <button onclick=" xemBoi()">Xem Boi</button>
    <p id="ketqua"></p>

    <!-- code javascript -->
    <script>
        //viet code javascript o day
        function xemBoi() {
            //anh xa
            let tenBan = document.getElementById("tenban").value;
            let tenNguoiYeu = document.getElementById("tennguoiyeu").value;
            let diem = Math.floor(Math.random() * 100) + 1;
            if (diem > 50) {
                document.getElementById("ketqua").innerHTML = tenBan + tenNguoiYeu + ".Diem: " + diem + ". Chuc mung. Hai ban rat hop nhau";
            } else {
                document.getElementById("ketqua").innerHTML = tenBan + tenNguoiYeu + ".Diem: " + diem + ". Chia tay som bot dau kho";
            }
        }
    </script>

</body>

</html>
