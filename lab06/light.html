<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Chong trinh bat / tat bong den</h2>
    <img id="bulb" width="120px" src="./bulboff.gif" alt="ligt">
    <br> <br>
    <button onclick="toggleLight()">On / Off</button>

    <!-- code javascript -->
    <script>
        //viet code javascript o day
        function toggleLight() {
            //anh xa
            let toggle = document.getElementById("bulb");
            if (toggle.src.includes("bulboff.gif")) {
                toggle.src = "./bulbon.gif";
            } else {
                toggle.src = "./bulboff.gif";
            }
        }
    </script>

</body>

</html>
