<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>

<body>

    <button onclick="choi('Đá')">Đá</button>
    <button onclick="choi('Giấy')">Giấy</button>
    <button onclick="choi('Kéo')">Kéo</button>

    <p id="ketQua"></p>

    <script>
        function choi(nguoiChon) {
            let luaChon = ["Đá", "Giấy", "Kéo"];
            let mayChon = luaChon[Math.floor(Math.random() * 3)];
            let kq = document.getElementById("ketQua");

            let thongBao = "Bạn chọn: " + nguoiChon + " | Máy chọn: " + mayChon + " -> ";

            if (nguoiChon === mayChon) {
                thongBao += "Hòa";
            } else if (
                (nguoiChon === "Đá" && mayChon === "Kéo") ||
                (nguoiChon === "Giấy" && mayChon === "Đá") ||
                (nguoiChon === "Kéo" && mayChon === "Giấy")
            ) {
                thongBao += "Thắng";
            } else {
                thongBao += "Thua";
            }

            kq.innerText = thongBao;
        }
    </script>

</body>

</html>
